name: Constellation quality gates

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional Python test dependencies
        run: python -m pip install --disable-pip-version-check pillow playwright
      - name: Run calendar and motion regression tests
        run: node --test tests/test_engine.mjs tests/test_motion.mjs tests/test_official.mjs tests/test_action.mjs tests/test_readme.mjs
      - name: Run GIF encoder regression tests
        run: python -m unittest tests/test_gif.py -v
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke, desktop and mobile
        run: python tests/browser_smoke.py
      - name: Validate SVG archive and reproducibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('assets').glob('*.svg')) + sorted(Path('assets/stress').glob('*.svg'))
          assert len(files) == 24, f"expected 24 modern SVGs, found {len(files)}"
          for file in files:
              assert ET.parse(file).getroot().tag.endswith('svg'), file
          print("Validated", len(files), "synthetic SVG assets")
          real = sorted(Path("assets/real/AdityaSreevatsaK").glob("*.svg"))
          if real:
              assert len(real) == 12, f"expected twelve real SVGs, got {len(real)}"
              for file in real:
                  assert ET.parse(file).getroot().attrib["data-source"] == "github_contribution_calendar"
              print("Validated", len(real), "real-account SVG assets")
          PY
          node export.mjs
          node export.mjs --input fixtures/streak-demo.json --out assets/stress --label "SYNTHETIC STREAK STRESS TEST"
          git diff --exit-code -- 'assets/*.svg' 'assets/stress/*.svg'
