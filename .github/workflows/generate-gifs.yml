name: Generate Constellation GIF previews

on:
  push:
    branches: [master]
    paths:
      - 'export_gif.py'
      - 'assets/stress/*-animated.svg'
      - '.github/workflows/generate-gifs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: constellation-preview-generation
  cancel-in-progress: true

jobs:
  render:
    if: github.repository == 'AdityaSreevatsaK/GitHub-Constellation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview tools
        run: |
          python -m pip install --disable-pip-version-check "pillow>=10,<13" "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium
      - name: Generate six native night/paper 16-second GIFs
        run: python export_gif.py
      - name: Validate timing, visible motion and output dimensions
        run: python -m unittest tests/test_gif.py -v
      - name: Commit generated GIF assets if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/stress/*-night.gif assets/stress/*-paper.gif
          if git diff --cached --quiet; then
            echo "Generated GIFs are already up to date"
          else
            git commit -m "chore(previews): regenerate six Constellation GIFs"
            git push origin HEAD:master
          fi
